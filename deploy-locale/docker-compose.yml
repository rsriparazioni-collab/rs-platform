services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: deploy-locale/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      COOKIE_SECURE: "false"
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    depends_on:
      - mongo

  frontend:
    build:
      context: ..
      dockerfile: deploy-locale/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backups:
