crons:
  - name: daily-digest
    description: "Invia ogni mattina alle 7:00 il riepilogo email di rinnovi e pagamenti in sospeso"
    cron: "0 7 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-digest"
  - name: riparazioni-ferme
    description: "Ogni mattina alle 8:30: avvisi WhatsApp (negozi, promemoria, vincoli, rinnovi, truffe, telefoni ordinati non arrivati dopo 5 giorni) e pulizia GDPR clienti inattivi >5 anni"
    cron: "30 8 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/riparazioni-ferme"
    method: POST
    enabled: true
  - name: whatsapp-due
    description: "Invia i messaggi WhatsApp in coda (richiesta recensione 5 minuti dopo il link privacy)"
    cron: "*/5 * * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/whatsapp-due"
    method: POST
    enabled: true
  - name: report-ritiri-mensile
    description: "Il 1° di ogni mese alle 6:00 invia alla commercialista di ogni negozio il registro ritiri usato del mese precedente (PDF + ZIP bolle/documenti)"
    cron: "0 6 1 * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/report-ritiri-mensile"
    method: POST
  - name: promemoria-registro-kpi
    description: "Alle 18:30 (lun-sab) WhatsApp a chi non ha segnato nulla nel Registro rapido KPI"
    cron: "30 18 * * 1-6"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/promemoria-registro"
    method: POST
    enabled: true
  - name: corrispettivi-giornalieri
    description: "Alle 19:00 WhatsApp con i corrispettivi del giorno (riparazioni, merce, art.74, fatture, contanti, POS, spese) di ogni negozio al numero impostato"
    cron: "0 19 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/corrispettivi-giornalieri"
    method: POST
    enabled: true
  - name: corrispettivi-mensile
    description: "Il 1° del mese alle 6:30 invia via email il PDF dei corrispettivi del mese precedente ai commercialisti dei negozi"
    cron: "30 6 1 * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/corrispettivi-mensile"
    method: POST
    enabled: true
  - name: corrispettivi-fine-mese
    description: "Alle 18:00 di ogni giorno; agisce solo l'ultimo giorno del mese: WhatsApp al negozio con il non versato che passa al mese successivo"
    cron: "0 18 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/corrispettivi-fine-mese"
    method: POST
    enabled: true
  - name: obiettivi-kpi
    description: "Alle 19:00 complimenti WhatsApp per obiettivi raggiunti; dal 15 promemoria se sotto il 40%"
    cron: "0 19 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/obiettivi"
    method: POST
    enabled: true
  - name: pdp-fogli-notte
    description: "Alle 02:00 rilegge il foglio Google del Punto di pareggio e avvisa su WhatsApp l'amministrazione se compaiono nuove differenze"
    cron: "0 2 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/pdp-fogli-notte"
    method: POST
    enabled: true
  - name: scadenze-fiscali
    description: "Alle 08:00 avvisa su WhatsApp l'amministrazione delle scadenze fiscali (IVA, acconti, INPS) in arrivo tra 7 giorni con l'importo stimato"
    cron: "0 8 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/scadenze-fiscali"
    method: POST
    enabled: true
  - name: incentivi-classifica
    description: "Ogni lunedì alle 9:00 invia ai partecipanti della gara Incentivi RS la posizione in classifica e la barra del fondo (solo se il modulo è online)"
    cron: "0 9 * * 1"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/incentivi/cron/classifica"
    method: POST
    enabled: true
  - name: incentivi-riepilogo-mese
    description: "Il 1º di ogni mese alle 8:00 manda all'amministrazione il riepilogo Incentivi RS del mese chiuso: fondo, classifica finale e premi da confermare"
    cron: "0 8 1 * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/incentivi/cron/riepilogo-mese"
    method: POST
    enabled: true
  - name: incentivi-sollecito-firme
    description: "Ogni giorno alle 10:00 rimanda su WhatsApp il link di firma del regolamento a chi non ha firmato dopo 3 giorni (max 3 solleciti)"
    cron: "0 10 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/incentivi/cron/sollecito-firme"
    method: POST
    enabled: true
  - name: riepilogo-lavorazioni
    description: "Alle 8:00 (lun-sab) WhatsApp agli addetti lavorazioni energia con il riepilogo: da lavorare, da reinserire, ferme, agenda"
    cron: "0 8 * * 1-6"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/riepilogo-lavorazioni"
    method: POST
    enabled: true
